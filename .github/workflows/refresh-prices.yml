name: refresh-prices

# Owned-by-cron: this workflow keeps the OBJECTIVE fields of every non-hidden entry
# in data.js fresh — price (UAH), rating (Steam %positive), ratingCount, year,
# oneCopy, imageUrl, previewUrl. Thresholds and field ownership live in the header
# comment of .github/scripts/refresh.py; below-threshold drift is silent.
#
# Skills (coop-hunter, fact-checker) read .github/refresh-status.json and skip these
# fields when the cron is healthy (< 30h since last success); if it is stale they
# fall back to doing the work themselves.
#
# RELIABILITY CONTRACT — see CLAUDE.md §8a before changing any of this:
#   * the sweep is budgeted + resumable, so `timeout-minutes` is a BACKSTOP and
#     raising it is never the fix for a slow sweep;
#   * the commit step is `if: always()` and refresh.py traps SIGTERM, so neither a
#     crash nor a cancelled job can discard already-applied updates or the cursor;
#   * health-check.yml watches this workflow and alarms on any silent failure.

on:
  schedule:
    # Daily at 04:00 UTC (07:00 Kyiv). GitHub schedules are best-effort —
    # actual fire time may drift by a few minutes during peak load.
    - cron: '0 4 * * *'
  workflow_dispatch:  # allows manual trigger from the Actions tab

permissions:
  contents: write   # needed to commit + push data.js + refresh-status.json

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Backstop only — the script stops itself at --budget-minutes (default 50).
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # full history not needed; default fetch-depth: 1 is fine
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run refresh script
        id: refresh
        # Failure must not skip the commit step below: whatever the sweep already
        # applied to data.js is good data and gets committed. The job is failed
        # explicitly in the last step instead.
        continue-on-error: true
        # A literal, not a workflow_dispatch input: one less expression in the file
        # the cron depends on. For a different budget set REFRESH_BUDGET_MINUTES, or
        # run the script locally with --budget-minutes / --full.
        run: python3 .github/scripts/refresh.py --budget-minutes 50

      - name: Show status file
        if: always()
        run: cat .github/refresh-status.json || echo "(no status file)"

      - name: Commit + push if changes
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One `git add` per file ON PURPOSE: `git add a b missing` aborts and stages
          # NOTHING, so a single vanished path used to leave the job green with an
          # empty commit set (~2026-06-05). Separately, one missing file can now cost
          # at most itself.
          for f in data.js .github/refresh-status.json status.js; do
            git add "$f" 2>/dev/null || echo "::warning::could not stage $f"
          done

          # Only commit if there are real changes (status file timestamp alone
          # shouldn't trigger noise — but data.js drift will).
          if git diff --cached --quiet -- data.js; then
            # No data changes — still commit status to record heartbeat,
            # but use a quieter message.
            git diff --cached --quiet && exit 0
            git commit -m "refresh: heartbeat (no drift)"
          else
            # The commit message is cosmetic, so building it must never be able to lose
            # the commit: under `bash -e` an unreadable or half-written status file (crash
            # before it was rewritten) would abort the step HERE, after data.js was
            # staged, discarding verified updates — the one thing this step exists for.
            MSG=$(python3 -c 'import json; u = json.load(open(".github/refresh-status.json"))["updates_applied"]; print("refresh: %s price, %s rating, %s count, %s image updates" % (u.get("price", 0), u.get("rating", 0), u.get("count", 0), u.get("image", 0)))' 2>/dev/null || true)
            git commit -m "${MSG:-refresh: data updates (counts unavailable)}"
          fi

          # Pull/rebase in case coop-hunter pushed during our run. On a conflict,
          # abort and fail the step rather than pushing a half-rebased tree —
          # a red job is visible; a silent bad push is not.
          if ! git pull --rebase origin main; then
            git rebase --abort 2>/dev/null || true
            echo "::error::rebase onto origin/main conflicted — not pushing"
            exit 1
          fi
          git push

      - name: Fail the job if the sweep errored
        if: steps.refresh.outcome != 'success'
        run: |
          echo "::error::refresh.py exited non-zero — see the 'Run refresh script' step."
          echo "Whatever it had already applied was still committed by the step above."
          exit 1
